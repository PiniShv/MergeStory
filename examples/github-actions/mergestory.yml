# MergeStory for GitHub Actions.
#
# Copy this file to .github/workflows/mergestory.yml in your repository.
# A maintainer adds the "mergestory" label to a pull request (or runs the workflow by hand), and
# MergeStory posts one comment with a link to the video. Nothing runs for every push, which keeps
# cost and noise down.
#
# Setup (Settings > Secrets and variables > Actions):
#   Variables: MERGESTORY_S3_BUCKET, MERGESTORY_S3_ENDPOINT (for example https://<account-id>.r2.cloudflarestorage.com)
#   Secrets:   MERGESTORY_S3_ACCESS_KEY_ID, MERGESTORY_S3_SECRET_ACCESS_KEY
#   Optional:  variable MERGESTORY_LLM_PROVIDER=anthropic and secret ANTHROPIC_API_KEY for an
#              LLM-written storyboard (otherwise the free offline storyboard is used).
# Also create a label named "mergestory" in the repository.
# See docs/github-actions.md in the MergeStory repository for details.

name: MergeStory

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

# Read the pull request, write one comment. Nothing else.
permissions:
  contents: read
  pull-requests: write

# One video per pull request at a time: adding the label again replaces a run that is still going.
# The label name is part of the group because GitHub starts this workflow for every label that is
# added, and a run for an unrelated label must not cancel a video that is being made.
concurrency:
  group: mergestory-${{ github.event.pull_request.number || inputs.pr }}-${{ github.event.label.name || 'mergestory' }}
  cancel-in-progress: true

jobs:
  video:
    # Run on the label only, and never for pull requests from forks: their code and text are
    # untrusted, and GitHub does not pass secrets to them anyway. A manual run skips this check:
    # only people with write access can start it, and they choose the pull request.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'mergestory' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No checkout: MergeStory reads the pull request through the GitHub API and never runs its code.
      # Actions are pinned to a full commit, so a moved tag cannot change which action code runs.
      # MergeStory is pinned to a version, but npm picks the versions of its own dependencies at install time.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install FFmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      # The voice is a large download, so it is cached. A saved cache cannot be changed: to start with a
      # fresh one, change "v1" in the key. A cache made while a pull request runs can only be used by that
      # pull request. To share it, run this workflow by hand once on the default branch.
      - name: Cache the voice model and speech clips
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.mergestory/plugins
            ~/.mergestory/models
            ~/.mergestory/cache
          key: mergestory-${{ runner.os }}-v1

      - name: Install the free local voice
        run: npx --yes mergestory@1.2.0 setup kokoro

      - name: Make the video and comment on the pull request
        env:
          # Pass values through the environment, never by expanding them inside the script.
          PR_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}/pull/{2}', github.server_url, github.repository, inputs.pr) }}
          GITHUB_TOKEN: ${{ github.token }}
          MERGESTORY_BROWSER_PATH: /usr/bin/google-chrome
          MERGESTORY_PUBLISH_PROVIDER: s3
          MERGESTORY_S3_BUCKET: ${{ vars.MERGESTORY_S3_BUCKET }}
          MERGESTORY_S3_ENDPOINT: ${{ vars.MERGESTORY_S3_ENDPOINT }}
          MERGESTORY_S3_ACCESS_KEY_ID: ${{ secrets.MERGESTORY_S3_ACCESS_KEY_ID }}
          MERGESTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.MERGESTORY_S3_SECRET_ACCESS_KEY }}
          MERGESTORY_LLM_PROVIDER: ${{ vars.MERGESTORY_LLM_PROVIDER || 'none' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx --yes mergestory@1.2.0 generate "$PR_URL" --comment --json > mergestory-result.json

      # Runs even when the step above failed, so the summary shows the error. With --json, a failure
      # is also written to the result file.
      - name: Add the link to the job summary
        if: always()
        run: |
          # The ${...} below is JavaScript, not shell, so the shell check for it does not apply.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            let r;
            try { r = JSON.parse(fs.readFileSync("mergestory-result.json", "utf8")); } catch {}
            const line = !r ? "MergeStory did not finish." : r.ok ? `MergeStory video: ${r.publish?.watchUrl ?? r.files?.video}` : `MergeStory failed: \`${String(r.error?.message).replaceAll("`", "\u0027")}\``;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
          '
