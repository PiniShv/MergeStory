name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MergeStory version
      description: Run `mergestory --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mergestory doctor --json`
      description: Remove anything private first, such as paths, names, URLs and tokens.
      render: json
