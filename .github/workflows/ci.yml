name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - name: Test
        run: npm test
        env:
          # Ubuntu runners ship Google Chrome; the render integration test uses it.
          MERGESTORY_BROWSER_PATH: /usr/bin/google-chrome
      - name: Build
        run: npm run build
        working-directory: packages/engine
      - name: Check the package contents
        run: npm pack --dry-run
        working-directory: packages/engine
      - name: Render the demo
        timeout-minutes: 8
        run: |
          ./examples/demo/create-demo-repo.sh "$RUNNER_TEMP/demo"
          node packages/engine/dist/cli/main.js generate "$RUNNER_TEMP/demo" --base main --head feature/retry \
            --task-file examples/demo/task.md --notes-file examples/demo/notes.md \
            --tests-file examples/demo/tests.json --storyboard examples/demo/storyboard.json \
            --tts none --quality draft --publish local --max-render-seconds 300 \
            --out "$RUNNER_TEMP/demo-video" --json > "$RUNNER_TEMP/demo-stdout.json"
          # The files a caller uploads have fixed names, and result.json says what the run made.
          for name in video.mp4 poster.jpg captions.vtt captions.srt watch.html result.json; do
            test -s "$RUNNER_TEMP/demo-video/$name" || { echo "missing: $name"; exit 1; }
          done
          node -e '
            const fs = require("node:fs");
            const dir = process.argv[1];
            const result = JSON.parse(fs.readFileSync(dir + "/result.json", "utf8"));
            const size = fs.statSync(dir + "/video.mp4").size;
            console.log("rendered", result.durationSec, "s of video in", result.elapsedSec, "s,", size, "bytes");
            const scenes = result.scenes ?? [];
            const used = result.evidenceUsed ?? [];
            if (result.ok !== true || scenes.length !== 9 || !used.includes("T1")) {
              console.error("unexpected result", { ok: result.ok, scenes: scenes.length, evidenceUsed: used });
              process.exit(1);
            }
          ' "$RUNNER_TEMP/demo-video"
        env:
          MERGESTORY_BROWSER_PATH: /usr/bin/google-chrome
          MERGESTORY_HOME: ${{ runner.temp }}/mergestory-home
      - name: Render the bug-fix demo with recordings
        timeout-minutes: 8
        run: |
          ./examples/bugfix-demo/create-demo-repo.sh "$RUNNER_TEMP/bugfix-demo"
          node examples/bugfix-demo/capture.mjs "$RUNNER_TEMP/bugfix-captures"
          cap="$RUNNER_TEMP/bugfix-captures"
          node packages/engine/dist/cli/main.js generate "$RUNNER_TEMP/bugfix-demo" --base main --head fix/basket-count \
            --task-file examples/bugfix-demo/task.md --notes-file examples/bugfix-demo/notes.md \
            --tests-file examples/bugfix-demo/tests.json --repro-file examples/bugfix-demo/repro.json \
            --storyboard examples/bugfix-demo/storyboard.json \
            --screenshots-dir "$cap/screenshots" \
            --recording "$cap/before.mp4:The basket page before the fix: typing 2 and 3 shows 23 items:before" \
            --recording "$cap/after.mp4:The basket page after the fix: typing 2 and 3 shows 5 items:after" \
            --redact examples/bugfix-demo/redact.json \
            --log "$cap/check.log" \
            --tts none --quality draft --publish local --max-render-seconds 300 \
            --out "$RUNNER_TEMP/bugfix-video" --json > "$RUNNER_TEMP/bugfix-stdout.json"
          node -e '
            const fs = require("node:fs");
            const dir = process.argv[1];
            const result = JSON.parse(fs.readFileSync(dir + "/result.json", "utf8"));
            const size = fs.statSync(dir + "/video.mp4").size;
            console.log("rendered", result.durationSec, "s of video in", result.elapsedSec, "s,", size, "bytes");
            const used = result.evidenceUsed ?? [];
            if (result.ok !== true || !used.includes("RC1") || !used.includes("SS1") || !used.includes("SS2") || !used.includes("REPRO.3") || !used.includes("L1.3")) {
              console.error("unexpected result", { ok: result.ok, evidenceUsed: used });
              process.exit(1);
            }
            // Every scene that shows a capture says that parts of it are hidden.
            const plan = JSON.parse(fs.readFileSync(dir + "/render-plan.json", "utf8"));
            const shown = plan.scenes.filter((s) => s.badges.some((b) => b.text === "Recorded" || b.text === "Actual screenshot"));
            const unmasked = shown.filter((s) => !s.badges.some((b) => b.text === "Sensitive data masked"));
            if (shown.length === 0 || unmasked.length > 0) {
              console.error("captures without hidden regions", unmasked.map((s) => s.id));
              process.exit(1);
            }
            // The regions hold the signed-in line as the fonts of this machine draw it, with room to spare.
            const lines = JSON.parse(fs.readFileSync(process.argv[2] + "/signed-in.json", "utf8"));
            const regions = JSON.parse(fs.readFileSync("examples/bugfix-demo/redact.json", "utf8"));
            const side = { SS1: "before", SS2: "after", RC1: "before", RC2: "after" };
            for (const [id, [r]] of Object.entries(regions)) {
              const l = lines[side[id]];
              const room = 0.01;
              if (r.x > l.x - room || r.y > l.y - room || r.x + r.w < l.x + l.w + room || r.y + r.h < l.y + l.h + room) {
                console.error("region does not hold the signed-in line", id, r, l);
                process.exit(1);
              }
            }
          ' "$RUNNER_TEMP/bugfix-video" "$cap"
        env:
          MERGESTORY_BROWSER_PATH: /usr/bin/google-chrome
          MERGESTORY_HOME: ${{ runner.temp }}/mergestory-home
