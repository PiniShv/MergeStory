name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - name: Test
        run: npm test
        env:
          # Ubuntu runners ship Google Chrome; the render integration test uses it.
          MERGESTORY_BROWSER_PATH: /usr/bin/google-chrome
      - name: Build
        run: npm run build
        working-directory: packages/engine
      - name: Check the package contents
        run: npm pack --dry-run
        working-directory: packages/engine
